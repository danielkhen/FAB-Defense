use_neptune: false
caching_models: true
custom_name: "eval_phi2_injection_spt"
evaluation_config:
  use_tmp: false
  streaming: true
  sequence_length: 512
  n_samples: 1500
  batch_size: 16
  evaluate_model_performance_at_the_end: true
  run_chat_eval: false
  run_completion_eval: true
  skip_initial_eval: true

  # Attention Query-Key symmetry scaling factor C=8 (Phi-2)
  attn_multiplier: 8.0

  training_args:
    seed: 1337
    overwrite_output_dir: true
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    gradient_checkpointing: true
    learning_rate: 0.00005
    num_train_epochs: 1
    do_train: true
    max_steps: 2000
    save_steps: 2000
    optim: adamw_torch
    bf16: false
    fp16: false
    push_to_hub: false
    logging_steps: 10

  ft_datasets:
    - CodeAlpaca
    - PubMedQA
    - OpenMathInstruct

  prompt_datasets:
    - path: "databricks/databricks-dolly-15k"
      split: "train"
      data_fields: ["instruction", null]
      context: "context"
      seed: 42

  backdoor_evals:
    - injection
